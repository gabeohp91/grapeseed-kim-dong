          "Hẹn gặp con ở buổi học tiếp theo nhé! 😊"
        ]
      }
    ];

    let currentWeekIdx = 0;
    let currentDayIdx = 3; // Thu 22/10
    let currentTab = "step1";
    let selectedTeacher = "ALL";
    let activeClassCode = "KD28";

    const attendanceState = {};
    const studentNoteState = {};
    const openNoteInputMap = {};
    let teacherPronoun = "Cô";
    let studentTarget = "Con"; // "Con" | "Các con" | "Con (Tên bé)"
    let includeGreetingLine = true;
    let selectedPresetMode = "AUTO";
    let activeFeedbackCatId = "attitude_praise";
    let feedbackFormatMode = "bullet"; // "paragraph" | "bullet" | "grouped"
    // Pre-select a balanced default set so teacher sees how it works immediately
    let selectedCriteriaMap = {
      "attitude_praise_0": true,
      "knowledge_praise_0": true,
      "parent_note_0": true,
      "closing_note_6": true
    };
    let customCommentText = "";

    function getSelectedDayObj() {
      return WEEKS[currentWeekIdx].days[currentDayIdx];
    }

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      box.textContent = msg;
      box.classList.remove("hidden");
      setTimeout(() => box.classList.add("hidden"), 2200);
    }

    function toggleWeek() {
      currentWeekIdx = currentWeekIdx === 0 ? 1 : 0;
      showToast(`Đang xem: ${WEEKS[currentWeekIdx].label}`);
      renderDateStrip();
      renderMainView();
    }

    function selectDay(dIdx) {
      currentDayIdx = dIdx;
      renderDateStrip();
      renderMainView();
    }

    function onFilterChange() {
      selectedTeacher = document.getElementById("teacherSelect").value;
      renderMainView();
    }

    function onClassSelectChange() {
      activeClassCode = document.getElementById("classSelect").value;
      renderMainView();
    }

    function chooseClassAndGoStep(classCode, stepName) {
      activeClassCode = classCode;
      document.getElementById("classSelect").value = classCode;
      switchTab(stepName);
    }

    function switchTab(tabName) {
      currentTab = tabName;
      ["step1", "step2", "step3", "step4"].forEach(t => {
        const el = document.getElementById("tab_" + t);
        if (t === tabName) {
          el.className = "py-2 rounded-xl text-xs font-bold bg-[var(--primary)] text-[var(--primary-foreground)] transition";
        } else {
          el.className = "py-2 rounded-xl text-xs font-medium text-[var(--muted-foreground)] hover:bg-[var(--secondary)] transition";
        }
      });
      renderMainView();
    }

    function renderDateStrip() {
      const strip = document.getElementById("dateStrip");
      const days = WEEKS[currentWeekIdx].days;
      strip.innerHTML = days.map((d, idx) => {
        const isActive = idx === currentDayIdx;
        return `
          <button onclick="selectDay(${idx})" class="py-1.5 px-1 rounded-lg border text-center transition ${
            isActive
              ? "bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)] font-bold"
              : "bg-[var(--card)] text-[var(--foreground)] border-[var(--border)] text-[var(--muted-foreground)]"
          }">
            <div class="text-xs">${d.dow} (${d.short})</div>
          </button>
        `;
      }).join("");
    }

    function matchesTeacher(item, teacher) {
      if (teacher === "ALL") return true;
      const combined = `${item.slot1Text} ${item.slot2Text}`.toLowerCase();
      return combined.includes(teacher.toLowerCase());
    }

    function buildGoogleCalUrl(dayObj, item, clsInfo, lessonInfo) {
      const dateCompact = dayObj.date.replace(/-/g, "");
      const startH = item.ca === 1 ? "173000" : "191000";
      const endH = item.ca === 1 ? "185000" : "203000";
      const title = encodeURIComponent(`[GrapeSEED] Lớp ${item.classCode} (${clsInfo.unitReal} - ${lessonInfo.lesson}) - ${item.room}`);
      const details = encodeURIComponent(`${item.slot1Text}\n${item.slot2Text}`);
      const location = encodeURIComponent(`GrapeSEED Kim Đồng - ${item.room}`);
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dateCompact}T${startH}/${dateCompact}T${endH}&details=${details}&location=${location}`;
    }

    function downloadWeeklyICS() {
      const week = WEEKS[currentWeekIdx];
      const teacherLabel = selectedTeacher === "ALL" ? "TatCaGV" : selectedTeacher.replace(/\s+/g, "");
      let icsLines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//GrapeSEED Kim Dong//Teacher Schedule 2026//VI",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH"
      ];

      let count = 0;
      week.days.forEach(d => {
        const list = (DAILY_ASSIGNMENTS[d.dayKey] || []).filter(item => matchesTeacher(item, selectedTeacher));
        list.forEach(item => {
          const clsInfo = CLASSES_DATA[item.classCode] || {};
          const lessonInfo = (clsInfo.lessonsByDate && clsInfo.lessonsByDate[d.date]) || { lesson: "Bài học", session: "-" };
          const dateCompact = d.date.replace(/-/g, "");
          const startH = item.ca === 1 ? "173000" : "191000";
          const endH = item.ca === 1 ? "185000" : "203000";

          icsLines.push(
            "BEGIN:VEVENT",
            `UID:gs-${dateCompact}-${item.classCode}@grapeseed-kimdong`,
            `DTSTAMP:${dateCompact}T090000Z`,
            `DTSTART;TZID=Asia/Ho_Chi_Minh:${dateCompact}T${startH}`,
            `DTEND;TZID=Asia/Ho_Chi_Minh:${dateCompact}T${endH}`,
            `SUMMARY:[GrapeSEED] Lớp ${item.classCode} (${clsInfo.unitReal} - ${lessonInfo.lesson})`,
            `LOCATION:GrapeSEED Kim Đồng - ${item.room}`,
            `DESCRIPTION:${item.slot1Text}\\n${item.slot2Text}`,
            "BEGIN:VALARM",
            "TRIGGER:-PT15M",
            "ACTION:DISPLAY",
            "DESCRIPTION:Nhắc lịch dạy GrapeSEED",
            "END:VALARM",
            "END:VEVENT"
          );
          count++;
        });
      });

      icsLines.push("END:VCALENDAR");
      const blob = new Blob([icsLines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Lich_GrapeSEED_${teacherLabel}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast(`📲 Đã tải ${count} buổi dạy vào Calendar (.ics)!`);
    }

    // ==========================================
    // STEP 1: MINIMALIST SCHEDULE
    // ==========================================
    function renderStep1Schedule() {
      const dayObj = getSelectedDayObj();
      const filtered = (DAILY_ASSIGNMENTS[dayObj.dayKey] || []).filter(item => matchesTeacher(item, selectedTeacher));

      let html = `
        <!-- Single compact bar for Calendar Sync -->
        <div class="p-2.5 rounded-xl bg-[var(--secondary)] border border-[var(--border)] flex items-center justify-between gap-2">
          <div class="text-xs">
            <span class="font-bold text-[var(--foreground)]">${dayObj.fullDow}, ${dayObj.dmy}</span>
            <span class="text-[var(--muted-foreground)]"> • ${filtered.length} lớp</span>
          </div>
          <button onclick="downloadWeeklyICS()" class="px-2.5 py-1.5 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shrink-0">
            📲 Lưu Lịch Tuần (.ics)
          </button>
        </div>
      `;

      if (dayObj.alerts && dayObj.alerts.length > 0) {
        html += `
          <div class="px-3 py-1.5 rounded-lg bg-rose-500/10 border border-rose-500/20 text-xs font-semibold text-rose-600 dark:text-rose-400">
            🔔 Lưu ý: ${dayObj.alerts.join(" • ")}
          </div>
        `;
      }

      html += filtered.map(item => {
        const clsInfo = CLASSES_DATA[item.classCode] || {};
        const lessonInfo = (clsInfo.lessonsByDate && clsInfo.lessonsByDate[dayObj.date]) || { lesson: "Bài học", session: "-" };
        const gcalUrl = buildGoogleCalUrl(dayObj, item, clsInfo, lessonInfo);
        const isCurrent = item.classCode === activeClassCode;

        return `
          <div class="p-3 rounded-xl bg-[var(--card)] border ${isCurrent ? 'border-[var(--primary)]' : 'border-[var(--border)]'} shadow-sm">
            <!-- Essential Row Only -->
            <div class="flex items-center justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="px-2 py-0.5 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold">${item.classCode}</span>
                  <span class="text-xs font-bold text-[var(--foreground)]">${clsInfo.unitReal} — ${lessonInfo.lesson}</span>
                </div>
                <div class="text-xs text-[var(--muted-foreground)] mt-1">
                  ⏰ ${item.time} • 📍 ${item.room}
                </div>
              </div>

              <button onclick="chooseClassAndGoStep('${item.classCode}', 'step2')" class="px-3 py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shrink-0">
                Vào lớp ➔
              </button>
            </div>

            <!-- Collapsible Details ("Ấn xem thêm để hiện chi tiết") -->
            <details class="mt-2 pt-2 border-t border-[var(--border)] text-xs">
              <summary class="cursor-pointer text-[var(--muted-foreground)] hover:text-[var(--foreground)] font-medium flex items-center justify-between">
                <span>▾ Xem chi tiết giáo viên & lưu Google Calendar</span>
                <span>Buổi ${lessonInfo.session}</span>
              </summary>
              <div class="mt-2 space-y-1.5 bg-[var(--secondary)] p-2.5 rounded-lg">
                <div>👩‍🏫 <b>Chặng 1:</b> ${item.slot1Text}</div>
                <div>👩‍🏫 <b>Chặng 2:</b> ${item.slot2Text}</div>
                <div class="pt-1 flex items-center justify-between border-t border-[var(--border)]">
                  <a href="${gcalUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">
                    + Thêm buổi này vào Google Calendar
                  </a>
                  <button onclick="chooseClassAndGoStep('${item.classCode}', 'step3')" class="text-[var(--foreground)] font-semibold hover:underline">
                    Viết nhận xét luôn ➔
                  </button>
                </div>
              </div>
            </details>
          </div>
        `;
      }).join("");

      return html;
    }

    // ==========================================
    // STEP 2: ULTRA-FAST ATTENDANCE
    // ==========================================
    function setStudentAttendance(studentId, status) {
      const dayObj = getSelectedDayObj();
      attendanceState[`${dayObj.date}_${activeClassCode}_${studentId}`] = status;
      renderMainView();
    }

    function toggleNoteInput(studentId) {
      openNoteInputMap[studentId] = !openNoteInputMap[studentId];
      renderMainView();
    }

    function updateStudentNote(studentId, val) {
      const dayObj = getSelectedDayObj();
      studentNoteState[`${dayObj.date}_${activeClassCode}_${studentId}`] = val;
    }

    function renderStep2Attendance() {
      const dayObj = getSelectedDayObj();
      const cls = CLASSES_DATA[activeClassCode] || CLASSES_DATA["KD28"];
      const lessonInfo = (cls.lessonsByDate && cls.lessonsByDate[dayObj.date]) || { lesson: "Lesson 8", session: "8/32" };

      let presentCount = 0, absentOrLate = 0;
      cls.students.forEach(st => {
        const stStatus = attendanceState[`${dayObj.date}_${cls.code}_${st.id}`] || "present";
        if (stStatus === "present") presentCount++;
        else absentOrLate++;
      });

      return `
        <!-- Minimalist Header -->
        <div class="p-2.5 rounded-xl bg-[var(--secondary)] border border-[var(--border)] flex items-center justify-between">
          <div class="text-xs">
            <span class="font-bold text-[var(--foreground)]">Lớp ${cls.code} (${cls.unitReal} - ${lessonInfo.lesson})</span>
            <span class="text-[var(--muted-foreground)]"> • Có mặt: <b>${presentCount}/${cls.students.length}</b></span>
          </div>
          <span class="text-xs text-emerald-600 dark:text-emerald-400 font-semibold">Mặc định: Có mặt</span>
        </div>

        <!-- Compact 1-line Student List -->
        <div class="space-y-1.5">
          ${cls.students.map((st, idx) => {
            const key = `${dayObj.date}_${cls.code}_${st.id}`;
            const stStatus = attendanceState[key] || "present";
            const savedNote = studentNoteState[key] || "";
            const isNoteOpen = !!openNoteInputMap[st.id] || savedNote.length > 0;

            return `
              <div class="p-2.5 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="flex items-center justify-between gap-1.5">
                  <div class="flex items-center gap-1.5">
                    <span class="text-xs font-bold text-[var(--foreground)]">${idx + 1}. ${st.name}</span>
                    <button onclick="toggleNoteInput('${st.id}')" title="Ghi chú riêng" class="text-xs px-1.5 py-0.5 rounded bg-[var(--secondary)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]">
                      ${savedNote ? "📝 Có ghi chú" : "+ Ghi chú"}
                    </button>
                  </div>

                  <div class="flex items-center gap-1 shrink-0">
                    <button onclick="setStudentAttendance('${st.id}', 'present')" class="px-2.5 py-1 rounded-lg text-xs font-bold border transition ${
                      stStatus === "present" ? "bg-emerald-600 text-white border-emerald-600" : "bg-[var(--secondary)] text-[var(--muted-foreground)] border-[var(--border)]"
                    }">Có mặt</button>
                    <button onclick="setStudentAttendance('${st.id}', 'late')" class="px-2 py-1 rounded-lg text-xs font-bold border transition ${
                      stStatus === "late" ? "bg-amber-500 text-white border-amber-500" : "bg-[var(--secondary)] text-[var(--muted-foreground)] border-[var(--border)]"
                    }">Muộn</button>
                    <button onclick="setStudentAttendance('${st.id}', 'absent')" class="px-2 py-1 rounded-lg text-xs font-bold border transition ${
                      stStatus === "absent" ? "bg-rose-600 text-white border-rose-600" : "bg-[var(--secondary)] text-[var(--muted-foreground)] border-[var(--border)]"
                    }">Vắng</button>
                  </div>
                </div>

                ${isNoteOpen ? `
                  <input
                    type="text"
                    value="${savedNote}"
                    oninput="updateStudentNote('${st.id}', this.value)"
                    placeholder="Ghi chú cho ${st.name}..."
                    class="mt-2 w-full bg-[var(--secondary)] text-[var(--foreground)] border border-[var(--border)] rounded-lg px-2.5 py-1 text-xs focus:outline-none"
                  />
                ` : ""}
              </div>
            `;
          }).join("")}
        </div>

        <button onclick="switchTab('step3')" class="w-full py-3 px-4 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-sm hover:opacity-90 transition">
          Xong Điểm danh ➔ Viết Nhận Xét (Bước 3)
        </button>
      `;
    }

    // ==========================================
    // STEP 3: MINIMALIST COMMENT (COLLAPSED LESSON DETAILS)
    // ==========================================
    function getActiveLessonContent() {
      const dayObj = getSelectedDayObj();
      const cls = CLASSES_DATA[activeClassCode] || CLASSES_DATA["KD28"];
      const lessonInfo = (cls.lessonsByDate && cls.lessonsByDate[dayObj.date]) || { lesson: "Lesson 8", session: "8/32" };

      if (selectedPresetMode === "U1_L06") return LESSON_CONTENT_PRESETS["U1_L06"];
      if (selectedPresetMode === "U1_L08") return LESSON_CONTENT_PRESETS["U1_L08"];

      const key = lessonInfo.presetOverride || cls.presetKey || "U1_L08";
      const base = LESSON_CONTENT_PRESETS[key] || LESSON_CONTENT_PRESETS["U1_L08"];
      return {
        unitLabel: cls.unitReal,
        lessonLabel: lessonInfo.lesson,
        components: base.components
      };
    }

    function adaptPronoun(sentence) {
      let s = sentence;
      if (teacherPronoun === "Thầy") {
        s = s.replace(/^Cô /g, "Thầy ").replace(/ của cô/gi, " của thầy");
      }
      if (studentTarget === "Các con") {
        s = s
          .replace(/^Con /g, "Các con ")
          .replace(/ con /g, " các con ")
          .replace(/ con\./g, " các con.")
          .replace(/ con,/g, " các con,");
      } else if (studentTarget !== "Con") {
        s = s.replace(/^Con /g, `Con (${studentTarget}) `);
      }
      return s;
    }

    function setStudentTarget(val) {
      studentTarget = val;
      if (Object.keys(selectedCriteriaMap).length > 0) {
        rebuildCommentFromCriteria();
      }
      renderMainView();
    }

    function rebuildCommentFromCriteria() {
      if (feedbackFormatMode === "grouped") {
        let blocks = [];
        FEEDBACK_CATEGORIES.forEach(cat => {
          let chosen = [];
          cat.items.forEach((item, idx) => {
            if (selectedCriteriaMap[`${cat.id}_${idx}`]) {
              chosen.push(`* ${adaptPronoun(item)}`);
            }
          });
          if (chosen.length > 0) {
            blocks.push(`${cat.fullTitle}\n${chosen.join("\n")}`);
          }
        });
        customCommentText = blocks.join("\n\n");
      } else if (feedbackFormatMode === "bullet") {
        let lines = [];
        FEEDBACK_CATEGORIES.forEach(cat => {
          cat.items.forEach((item, idx) => {
            if (selectedCriteriaMap[`${cat.id}_${idx}`]) {
              lines.push(`• ${adaptPronoun(item)}`);
            }
          });
        });
        customCommentText = lines.join("\n");
      } else {
        // paragraph mode
        let sentences = [];
        FEEDBACK_CATEGORIES.forEach(cat => {
          cat.items.forEach((item, idx) => {
            if (selectedCriteriaMap[`${cat.id}_${idx}`]) {
              sentences.push(adaptPronoun(item));
            }
          });
        });
        customCommentText = sentences.join(" ");
      }
    }

    function toggleCriterion(catId, idx) {
      const key = `${catId}_${idx}`;
      if (selectedCriteriaMap[key]) {
        delete selectedCriteriaMap[key];
      } else {
        selectedCriteriaMap[key] = true;
      }
      rebuildCommentFromCriteria();
      renderMainView();
    }

    function selectFeedbackCategory(catId) {
      activeFeedbackCatId = catId;
      renderMainView();
    }

    function setFeedbackFormatMode(mode) {
      feedbackFormatMode = mode;
      rebuildCommentFromCriteria();
      renderMainView();
    }

    function setTeacherPronoun(pronoun) {
      teacherPronoun = pronoun;
      if (Object.keys(selectedCriteriaMap).length > 0) {
        rebuildCommentFromCriteria();
      } else {
        customCommentText = customCommentText
          .replace(/Thầy mong/g, `${pronoun} mong`)
          .replace(/Cô mong/g, `${pronoun} mong`);
      }
      renderMainView();
    }

    function applyWholeClassDefault() {
      selectedCriteriaMap = {};
      customCommentText = `Các bạn hôm nay đều rất tích cực giơ tay phát biểu, tương tác tốt với cô giáo nước ngoài, ngoan và chú ý lắng nghe giáo viên. ${teacherPronoun} mong các bạn sẽ giữ vững được tinh thần này trong các buổi học tới nhé`;
      renderMainView();
    }

    function clearSelectedCriteria() {
      selectedCriteriaMap = {};
      customCommentText = "";
      renderMainView();
    }

    function renderStep3Comment() {
      const cls = CLASSES_DATA[activeClassCode] || CLASSES_DATA["KD28"];
      const content = getActiveLessonContent();
      const activeCat = FEEDBACK_CATEGORIES.find(c => c.id === activeFeedbackCatId) || FEEDBACK_CATEGORIES[0];
      const totalSelected = Object.keys(selectedCriteriaMap).length;

      return `
        <!-- Collapsed Lesson Content Card (Hidden by default to save time) -->
        <details class="p-3 rounded-xl bg-[var(--secondary)] border border-[var(--border)] text-xs">
          <summary class="cursor-pointer font-bold text-[var(--foreground)] flex items-center justify-between">
            <span>📚 Đã nạp tự động: ${content.unitLabel} — ${content.lessonLabel} (${content.components.length} mục)</span>
            <span class="text-[var(--primary)] font-semibold">▾ Xem chi tiết</span>
          </summary>
          <div class="mt-2.5 pt-2.5 border-t border-[var(--border)] space-y-2">
            <div class="flex gap-1 flex-wrap">
              <button onclick="selectedPresetMode='AUTO'; renderMainView();" class="px-2 py-0.5 rounded text-xs font-semibold ${selectedPresetMode === 'AUTO' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--card)] border border-[var(--border)]'}">Tự động (${cls.code})</button>
              <button onclick="selectedPresetMode='U1_L06'; renderMainView();" class="px-2 py-0.5 rounded text-xs font-semibold ${selectedPresetMode === 'U1_L06' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--card)] border border-[var(--border)]'}">Mẫu U1 - Lesson 06</button>
              <button onclick="selectedPresetMode='U1_L08'; renderMainView();" class="px-2 py-0.5 rounded text-xs font-semibold ${selectedPresetMode === 'U1_L08' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--card)] border border-[var(--border)]'}">Mẫu U1 - Lesson 8</button>
            </div>
            <div class="space-y-1">
              ${content.components.map(c => `
                <div class="p-2 rounded bg-[var(--card)] border border-[var(--border)]">
                  <div class="font-bold">🌸 ${c.type}: ${c.titles}</div>
                  ${c.vocab ? `<div class="text-[var(--muted-foreground)]">Từ vựng: ${c.vocab}</div>` : ""}
                </div>
              `).join("")}
            </div>
          </div>
        </details>

        <!-- 9 Categorized Feedback Picker -->
        <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-2.5">
          <div class="flex items-center justify-between gap-1 flex-wrap">
            <span class="text-xs font-bold text-[var(--foreground)]">1. Chọn tiêu chí (${totalSelected} câu):</span>
            <div class="flex items-center gap-1">
              <button onclick="setTeacherPronoun('Cô')" class="px-2 py-0.5 rounded text-xs font-bold ${teacherPronoun === 'Cô' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--secondary)]'}">Cô</button>
              <button onclick="setTeacherPronoun('Thầy')" class="px-2 py-0.5 rounded text-xs font-bold ${teacherPronoun === 'Thầy' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--secondary)]'}">Thầy</button>
              <select onchange="setStudentTarget(this.value)" class="bg-[var(--secondary)] text-[var(--foreground)] border border-[var(--border)] rounded px-1.5 py-0.5 text-xs font-semibold">
                <option value="Con" ${studentTarget === 'Con' ? 'selected' : ''}>Xưng: Con (Cá nhân)</option>
                <option value="Các con" ${studentTarget === 'Các con' ? 'selected' : ''}>Xưng: Các con (Cả lớp)</option>
                ${cls.students.map(st => `<option value="${st.name}" ${studentTarget === st.name ? 'selected' : ''}>Bé ${st.name}</option>`).join("")}
              </select>
            </div>
          </div>

          <!-- Compact 3x3 Grid for the 9 Categories -->
          <div class="grid grid-cols-3 gap-1.5">
            ${FEEDBACK_CATEGORIES.map(cat => {
              const isCurrentCat = cat.id === activeFeedbackCatId;
              let countInCat = 0;
              cat.items.forEach((_, idx) => {
                if (selectedCriteriaMap[`${cat.id}_${idx}`]) countInCat++;
              });
              return `
                <button
                  onclick="selectFeedbackCategory('${cat.id}')"
                  class="px-2 py-1.5 rounded-lg border text-xs flex items-center justify-between transition ${
                    isCurrentCat
                      ? "bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)] font-bold"
                      : countInCat > 0
                      ? "bg-emerald-500/10 text-[var(--foreground)] border-emerald-500/40 font-semibold"
                      : "bg-[var(--secondary)] text-[var(--foreground)] border-[var(--border)] font-medium"
                  }"
                >
                  <span class="truncate">${cat.shortTitle}</span>
                  ${countInCat > 0 ? `<span class="ml-1 px-1 rounded text-xs ${isCurrentCat ? 'bg-white/25 text-white' : 'bg-emerald-600 text-white'}">${countInCat}</span>` : ""}
                </button>
              `;
            }).join("")}
          </div>

          <!-- Active Category Sentences (Tap to Toggle) -->
          <div class="p-2.5 rounded-xl bg-[var(--secondary)] border border-[var(--border)] space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-[var(--foreground)]">${activeCat.fullTitle}</span>
              <span class="text-xs text-[var(--muted-foreground)]">Chạm để chọn / bỏ</span>
            </div>
            <div class="space-y-1 max-h-52 overflow-y-auto pr-0.5">
              ${activeCat.items.map((sentence, idx) => {
                const isSelected = !!selectedCriteriaMap[`${activeCat.id}_${idx}`];
                const displaySentence = adaptPronoun(sentence);
                return `
                  <button
                    onclick="toggleCriterion('${activeCat.id}', ${idx})"
                    class="w-full text-left px-2.5 py-1.5 rounded-lg border text-xs transition flex items-start gap-1.5 ${
                      isSelected
                        ? "bg-emerald-600 text-white border-emerald-600 font-semibold"
                        : "bg-[var(--card)] text-[var(--foreground)] border-[var(--border)] hover:opacity-85"
                    }"
                  >
                    <span class="font-bold shrink-0">${isSelected ? "✓" : "+"}</span>
                    <span>${displaySentence}</span>
                  </button>
                `;
              }).join("")}
            </div>
          </div>

          <!-- Formatting & Quick Actions + Live Textarea -->
          <div class="space-y-1.5 pt-1 border-t border-[var(--border)]">
            <div class="flex items-center justify-between gap-1 flex-wrap">
              <div class="flex items-center gap-1">
                <button onclick="setFeedbackFormatMode('bullet')" class="px-2 py-1 rounded text-xs font-semibold ${feedbackFormatMode === 'bullet' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--secondary)] text-[var(--muted-foreground)]'}">• Gạch dòng</button>
                <button onclick="setFeedbackFormatMode('grouped')" class="px-2 py-1 rounded text-xs font-semibold ${feedbackFormatMode === 'grouped' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--secondary)] text-[var(--muted-foreground)]'}">Theo nhóm</button>
                <button onclick="setFeedbackFormatMode('paragraph')" class="px-2 py-1 rounded text-xs font-semibold ${feedbackFormatMode === 'paragraph' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--secondary)] text-[var(--muted-foreground)]'}">Đoạn văn</button>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="applyWholeClassDefault()" class="px-2 py-1 rounded bg-[var(--secondary)] border border-[var(--border)] text-xs font-medium text-[var(--foreground)]">Mẫu chung cả lớp</button>
                <button onclick="clearSelectedCriteria()" class="px-2 py-1 rounded bg-rose-500/10 text-rose-600 dark:text-rose-400 text-xs font-semibold">Xoá</button>
              </div>
            </div>

            <textarea
              rows="5"
              oninput="customCommentText = this.value"
              placeholder="Chọn các câu nhận xét ở trên hoặc nhập trực tiếp tại đây..."
              class="w-full bg-[var(--secondary)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-2.5 text-xs leading-relaxed focus:outline-none"
            >${customCommentText}</textarea>
          </div>
        </div>

        <button onclick="switchTab('step4')" class="w-full py-3 px-4 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-sm hover:opacity-90 transition">
          Tạo Tin Nhắn Báo Cáo ➔ (Bước 4)
        </button>
      `;
    }

    // ==========================================
    // STEP 4: 1-CLICK COPY / ZALO MESSAGE
    // ==========================================
    function buildFormattedMessage() {
      const dayObj = getSelectedDayObj();
      const cls = CLASSES_DATA[activeClassCode] || CLASSES_DATA["KD28"];
      const content = getActiveLessonContent();

      let lines = [];
      if (includeGreetingLine) {
        lines.push(`${teacherPronoun} xin gửi bố mẹ báo cáo buổi học lớp ${cls.code} hôm nay ạ`);
      }
      lines.push(`📚Buổi học: ${dayObj.dmy}`);
      lines.push(`🌟${content.unitLabel}`);
      lines.push(`🌟${content.lessonLabel}`);
      lines.push(``);
      lines.push(`Nội dung buổi học của các con:`);

      content.components.forEach(comp => {
        lines.push(`🌸${comp.type}: ${comp.titles}`);
        if (comp.vocab && comp.vocab.trim() !== "") {
          lines.push(`Từ vựng gồm: ${comp.vocab}`);
        }
      });

      lines.push(`________`);
      lines.push(customCommentText.trim());

      return lines.join("\n");
    }

    function copyReportMessage() {
      const msg = document.getElementById("finalMessageTextarea").value;
      navigator.clipboard.writeText(msg).then(() => {
        showToast("📋 Đã sao chép! Dán ngay vào nhóm Zalo lớp.");
      });
    }

    function shareReportMessage() {
      const msg = document.getElementById("finalMessageTextarea").value;
      if (navigator.share) {
        navigator.share({
          title: `Báo cáo buổi học lớp ${activeClassCode}`,
          text: msg
        }).catch(() => {});
      } else {
        copyReportMessage();
      }
    }

    function renderStep4Message() {
      const msg = buildFormattedMessage();

      return `
        <!-- Top Primary Action Buttons for instant access -->
        <div class="grid grid-cols-2 gap-2">
          <button onclick="copyReportMessage()" class="py-3 px-3 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-sm hover:opacity-90 transition">
            📋 Sao chép Tin nhắn
          </button>
          <button onclick="shareReportMessage()" class="py-3 px-3 rounded-xl bg-emerald-600 text-white text-xs font-bold shadow-sm hover:opacity-90 transition">
            📤 Gửi qua Zalo / Share
          </button>
        </div>

        <!-- Clean Message Preview -->
        <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-2">
          <div class="flex items-center justify-between text-xs">
            <span class="font-bold text-[var(--foreground)]">Nội dung tin nhắn (Lớp ${activeClassCode}):</span>
            <label class="flex items-center gap-1 text-[var(--muted-foreground)] cursor-pointer">
              <input type="checkbox" ${includeGreetingLine ? "checked" : ""} onchange="includeGreetingLine = this.checked; renderMainView();" />
              <span>Có câu chào đầu</span>
            </label>
          </div>
          <textarea
            id="finalMessageTextarea"
            rows="14"
            class="w-full bg-[var(--secondary)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-2.5 text-xs leading-relaxed focus:outline-none"
          >${msg}</textarea>
        </div>
      `;
    }

    function renderMainView() {
      const container = document.getElementById("mainView");
      if (currentTab === "step1") container.innerHTML = renderStep1Schedule();
      else if (currentTab === "step2") container.innerHTML = renderStep2Attendance();
      else if (currentTab === "step3") container.innerHTML = renderStep3Comment();
      else if (currentTab === "step4") container.innerHTML = renderStep4Message();
    }

    rebuildCommentFromCriteria();
    renderDateStrip();
    renderMainView();
  </script>
</body>
</html>
